<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="Illustration of one hiker at a summit reaching down to pull a teammate up the last stretch, an amber flag planted beside them.">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242C1C"/>
      <stop offset="0.6" stop-color="#1C2016"/>
      <stop offset="1" stop-color="#171A12"/>
    </linearGradient>
    <radialGradient id="sGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D2913C" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#D2913C" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#D2913C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sPeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A452E"/>
      <stop offset="1" stop-color="#1A1E13"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sSky)"/>
  <circle cx="620" cy="300" r="380" fill="url(#sGlow)"/>

  <!-- cloud bands below the summit -->
  <g fill="#ECE6D6" fill-opacity="0.06">
    <ellipse cx="240" cy="640" rx="300" ry="34"/>
    <ellipse cx="900" cy="700" rx="340" ry="38"/>
    <ellipse cx="560" cy="742" rx="420" ry="30"/>
  </g>

  <!-- far ridges -->
  <path d="M0 560 L 170 474 L 300 540 L 470 430 L 620 520 L 780 450 L 940 530 L 1090 470 L 1200 520 L 1200 900 L 0 900 Z"
        fill="#2F3925" fill-opacity="0.55"/>

  <!-- the summit itself -->
  <path d="M170 900 L 600 250 L 1040 900 Z" fill="url(#sPeak)"/>
  <path d="M600 250 L 745 465 L 600 420 L 505 470 Z" fill="#ECE6D6" fill-opacity="0.1"/>

  <!-- the last stretch of trail -->
  <path d="M760 880 C 720 780, 690 700, 640 612 C 620 578, 612 540, 606 500"
        fill="none" stroke="#D2913C" stroke-opacity="0.3" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="24 18"/>

  <!-- the flag planted at the victory point -->
  <g>
    <path d="M700 452 L 700 300" stroke="#ECE6D6" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
    <path d="M700 306 L 786 334 L 700 364 Z" fill="#D2913C"/>
  </g>

  <!-- one hand down, one hand up: the whole point of the thing -->
  <g fill="#0E1109" stroke="#0E1109" stroke-linecap="round">
    <!-- teammate already up, reaching back -->
    <g transform="translate(646,452)">
      <circle cx="0" cy="-46" r="12" stroke="none"/>
      <path d="M-12 -31 L 12 -31 L 8 6 L -8 6 Z" stroke="none"/>
      <path d="M-8 6 L -15 44 M 8 6 L 16 44" stroke-width="8"/>
      <path d="M8 -24 L 44 4" stroke-width="8"/>
      <!-- far arm, hanging for balance -->
      <path d="M-10 -26 L -22 -4" stroke-width="7.5"/>
    </g>
    <!-- teammate on the climb, reaching up -->
    <g transform="translate(712,526)">
      <circle cx="4" cy="-44" r="12" stroke="none"/>
      <path d="M-8 -29 L 16 -29 L 12 8 L -4 8 Z" stroke="none"/>
      <path d="M-4 8 L -12 46 M 12 8 L 20 46" stroke-width="8"/>
      <path d="M-6 -22 L -24 -54" stroke-width="8"/>
      <!-- trailing arm, hanging at the side -->
      <path d="M14 -25 L 25 -2" stroke-width="7.5"/>
    </g>
  </g>
</svg>
