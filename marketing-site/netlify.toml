[[redirects]]
  from = "/marketing.html"
  to = "/"
  status = 301

# The head-to-head WHOOP page was replaced by the complement-framed tracker page.
[[redirects]]
  from = "/vs/whoop"
  to = "/fitness-trackers"
  status = 301

[[headers]]
  for = "/marketing/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
