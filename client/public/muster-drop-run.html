<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muster up — Drop & Run</title>
<style>
  :root{ --field:#181B14; --surface:#20241A; --bone:#ECE6D6; --dim:#9AA088; --ochre:#D2913C; --slate:#6E93A6; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(125% 130% at 50% 0%,#20241A,#181B14 60%,#101307);
    color:var(--bone);font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:38px 16px;gap:24px;}
  .kicker{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);}
  .stage{width:min(98vw,960px);background:rgba(32,36,26,.40);border:1px solid rgba(214,202,176,.09);
    border-radius:20px;padding:26px 22px 22px;box-shadow:0 26px 64px -32px rgba(0,0,0,.72);}
  svg{width:100%;height:auto;display:block;overflow:visible;}
  .controls{display:flex;gap:10px;align-items:center;}
  button{font:600 13px/1 inherit;color:var(--bone);background:rgba(210,145,60,.14);
    border:1px solid rgba(210,145,60,.5);border-radius:999px;padding:10px 20px;cursor:pointer;
    transition:background .15s,transform .05s;-webkit-tap-highlight-color:transparent;}
  button:hover{background:rgba(210,145,60,.26);}
  button:active{transform:translateY(1px);}
  button.ghost{background:transparent;border-color:rgba(214,202,176,.28);color:var(--dim);}
  .cap{font-size:12.5px;color:var(--dim);max-width:600px;text-align:center;line-height:1.7;}
  noscript{display:block;color:var(--dim);font-size:12px;margin-top:10px;}
</style></head>
<body>
  <span class="kicker">Muster up · motion study</span>

  <div class="stage">
    <svg id="scene" viewBox="0 0 496 104" role="img" aria-label="Five climbers parachute down into the middle of the word, then run to camp, while the word Muster up floats into place.">
      <g id="content" transform="translate(10,8)">

        <!-- sky -->
        <g id="cloudsG"></g>
        <g id="birds"></g>

        <!-- distant ground swells -->
        <path d="M20,94 Q100,80 180,94 Z" fill="#36412c" opacity="0.30"/>
        <path d="M205,95 Q335,78 475,95 Z" fill="#2f3925" opacity="0.30"/>

        <!-- creek -->
        <path d="M150,86 Q172,83 196,86 Q220,89 250,86" fill="none" stroke="#6E93A6" stroke-width="1.5" stroke-linecap="round" opacity="0.42"/>
        <path d="M154,88 Q176,85 200,88 Q224,91 252,88" fill="none" stroke="#6E93A6" stroke-width="1.0" stroke-linecap="round" opacity="0.28"/>

        <!-- trees behind -->
        <g id="treesBack"></g>

        <!-- static MARK (with flag + beacon + pulse) -->
        <g id="mark">
          <circle cx="49" cy="64" r="10" fill="none" stroke="#ECE6D6" stroke-width="1.2" opacity="0.28"/>
          <circle id="pulse" cx="49" cy="64" r="6.5" fill="none" stroke="#6E93A6" stroke-width="1.4"/>
          <path d="M17 76 L32 34 L49 64 L67 20 L84 74" fill="none" stroke="#ECE6D6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="17" cy="76" r="2.9" fill="#ECE6D6"/>
          <circle cx="84" cy="74" r="2.6" fill="#ECE6D6"/>
          <circle cx="32" cy="34" r="3.3" fill="#D2913C"/>
          <circle cx="67" cy="20" r="3.4" fill="#D2913C"/>
          <line x1="67" y1="20" x2="67" y2="4" stroke="#ECE6D6" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M67 4 L80 8 L67 11.5 Z" fill="#D2913C"/>
          <circle cx="49" cy="64" r="6.5" fill="#181B14" stroke="#ECE6D6" stroke-width="2.2"/>
          <circle cx="49" cy="64" r="3.3" fill="#6E93A6"/>
        </g>

        <!-- winding dotted trail (filled by JS) -->
        <g id="dotsG"></g>

        <!-- USTER set in Liberation Sans Bold (the logo wordmark face); float up into place -->
        <g id="lettersG" fill="#ECE6D6">
          <g class="lt"><path d="M723 -20Q432 -20 277.5 122.0Q123 264 123 528V1409H418V551Q418 384 497.5 297.5Q577 211 731 211Q889 211 974.0 301.5Q1059 392 1059 561V1409H1354V543Q1354 275 1188.5 127.5Q1023 -20 723 -20Z" transform="translate(100.00,76) scale(0.03974,-0.03974)"/></g>
          <g class="lt"><path d="M1286 406Q1286 199 1132.5 89.5Q979 -20 682 -20Q411 -20 257.0 76.0Q103 172 59 367L344 414Q373 302 457.0 251.5Q541 201 690 201Q999 201 999 389Q999 449 963.5 488.0Q928 527 863.5 553.0Q799 579 616 616Q458 653 396.0 675.5Q334 698 284.0 728.5Q234 759 199.0 802.0Q164 845 144.5 903.0Q125 961 125 1036Q125 1227 268.5 1328.5Q412 1430 686 1430Q948 1430 1079.5 1348.0Q1211 1266 1249 1077L963 1038Q941 1129 873.5 1175.0Q806 1221 680 1221Q412 1221 412 1053Q412 998 440.5 963.0Q469 928 525.0 903.5Q581 879 752 842Q955 799 1042.5 762.5Q1130 726 1181.0 677.5Q1232 629 1259.0 561.5Q1286 494 1286 406Z" transform="translate(170.18,76) scale(0.03974,-0.03974)"/></g>
          <g class="lt"><path d="M773 1181V0H478V1181H23V1409H1229V1181Z" transform="translate(235.86,76) scale(0.03974,-0.03974)"/></g>
          <g class="lt"><path d="M137 0V1409H1245V1181H432V827H1184V599H432V228H1286V0Z" transform="translate(296.98,76) scale(0.03974,-0.03974)"/></g>
          <g class="lt"><path d="M1105 0 778 535H432V0H137V1409H841Q1093 1409 1230.0 1300.5Q1367 1192 1367 989Q1367 841 1283.0 733.5Q1199 626 1056 592L1437 0ZM1070 977Q1070 1180 810 1180H432V764H818Q942 764 1006.0 820.0Q1070 876 1070 977Z" transform="translate(362.67,76) scale(0.03974,-0.03974)"/></g>
        </g>

        <!-- camp: tent + fire (destination) -->
        <g id="camp">
          <polygon points="443.8,83 453.8,83 453.8,68" fill="#d7d0bc"/>
          <polygon points="453.8,83 463.8,83 453.8,68" fill="#9AA088"/>
          <polygon points="450.3,83 457.3,83 453.8,75.5" fill="#181B14"/>
          <path d="M443.8,83 L453.8,68 L463.8,83" fill="none" stroke="#ECE6D6" stroke-width="0.9" stroke-linejoin="round"/>
          <line x1="453.8" y1="68" x2="453.8" y2="83" stroke="#ECE6D6" stroke-width="0.7"/>
          <line x1="435.3" y1="83" x2="440.3" y2="81.4" stroke="#5a4a32" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="435.3" y1="81.4" x2="440.3" y2="83" stroke="#5a4a32" stroke-width="1.3" stroke-linecap="round"/>
          <g id="fire">
            <path d="M437.8,82 C435.3,79 436.9,75.5 437.8,73 C438.7,75.5 440.3,79 437.8,82 Z" fill="#D2913C"/>
            <path d="M437.8,82 C436.6,80 437.4,77.6 437.8,76.2 C438.2,77.6 439.0,80 437.8,82 Z" fill="#f0c46a"/>
          </g>
        </g>

        <!-- 'up' (Liberation Sans Bold lowercase, above the tent; floats up last) -->
        <g id="upWord" fill="#ECE6D6">
          <path d="M408 1082V475Q408 190 600 190Q702 190 764.5 277.5Q827 365 827 502V1082H1108V242Q1108 104 1116 0H848Q836 144 836 215H831Q775 92 688.5 36.0Q602 -20 483 -20Q311 -20 219.0 85.5Q127 191 127 395V1082Z" transform="translate(436.73,59) scale(0.01386,-0.01386)"/>
          <path d="M1167 546Q1167 275 1058.5 127.5Q950 -20 752 -20Q638 -20 553.5 29.5Q469 79 424 172H418Q424 142 424 -10V-425H143V833Q143 986 135 1082H408Q413 1064 416.5 1011.0Q420 958 420 906H424Q519 1105 770 1105Q959 1105 1063.0 959.5Q1167 814 1167 546ZM874 546Q874 910 651 910Q539 910 479.5 812.0Q420 714 420 538Q420 363 479.5 267.5Q539 172 649 172Q874 172 874 546Z" transform="translate(454.65,59) scale(0.01386,-0.01386)"/>
        </g>

        <!-- trees near camp (front) -->
        <g id="treesFront"></g>

        <!-- jumpers (filled by JS) -->
        <g id="menG"></g>
      </g>
    </svg>

    <noscript>This motion study needs JavaScript to run. The mark, wordmark and camp are shown above.</noscript>
  </div>

  <div class="controls">
    <button id="replay">Replay</button>
    <button id="loop" class="ghost">Loop: on</button>
  </div>
  <p class="cap">Five jumpers drop in between the S and T, then run the route to camp &mdash; while <strong>Muster&nbsp;up</strong> floats into place.</p>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const $=id=>document.getElementById(id);

  /* ---------- scene constants ---------- */
  const GROUND=83, AMP=3.0, WL=88, CYCLE=7400, FLOAT_OFF=44;
  const yAt = x => GROUND + AMP*Math.sin((x-94)/WL*2*Math.PI);
  function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}

  /* ---------- clouds ---------- */
  function cloud(cx,cy,s,op){
    const g=mk('g',{});
    [[-7,0,5,4],[0,-3,7,5.5],[7,0,5.5,4.2],[0,1.6,9,4]].forEach(function(a){
      g.appendChild(mk('ellipse',{cx:cx+a[0]*s,cy:cy+a[1]*s,rx:a[2]*s,ry:a[3]*s,fill:'#ECE6D6',opacity:op}));});
    return g;
  }
  [[78,15,1.0,0.12],[250,11,1.25,0.10],[430,16,0.95,0.12]].forEach(function(c){$('cloudsG').appendChild(cloud(c[0],c[1],c[2],c[3]));});

  /* ---------- birds ---------- */
  [[150,26,1.0],[162,30,0.8],[355,21,1.0],[368,26,0.9]].forEach(function(b){
    var bx=b[0],by=b[1],s=b[2];
    $('birds').appendChild(mk('path',{
      d:'M'+(bx-4*s)+','+by+' Q'+(bx-2*s)+','+(by-2.6*s)+' '+bx+','+(by-0.6*s)+' Q'+(bx+2*s)+','+(by-2.6*s)+' '+(bx+4*s)+','+by,
      fill:'none',stroke:'#9AA088','stroke-width':0.8,'stroke-linecap':'round',opacity:0.7}));
  });

  /* ---------- pines ---------- */
  function pine(into,bx,by,h,op){
    const g=mk('g',{opacity:op});
    g.appendChild(mk('line',{x1:bx,y1:by,x2:bx,y2:by-h*0.2,stroke:'#5a4a32','stroke-width':h*0.12,'stroke-linecap':'round'}));
    function tri(w,y0,y1){return mk('polygon',{points:(bx-w)+','+(by-y0)+' '+(bx+w)+','+(by-y0)+' '+bx+','+(by-y1),fill:'#4d5b35'});}
    g.appendChild(tri(h*0.30, h*0.15, h*0.62));
    g.appendChild(tri(h*0.24, h*0.38, h*0.80));
    g.appendChild(tri(h*0.18, h*0.60, h*1.00));
    into.appendChild(g);
  }
  pine($('treesBack'),11,83,12,0.6);
  pine($('treesBack'),178,83,11,0.5);
  pine($('treesBack'),320,83,10,0.5);
  pine($('treesFront'),466.8,83,13,0.85);
  pine($('treesFront'),474.8,83,12,0.8);
  pine($('treesFront'),459.8,83,15,0.78);

  /* ---------- letters + 'up' : float-up reveal ---------- */
  const floatItems=[];
  const ltStart=[1350,2225,3050,3813,4638];
  document.querySelectorAll('#lettersG .lt').forEach(function(g,i){ floatItems.push({el:g, start:ltStart[i]}); });
  floatItems.push({el:$('upWord'), start:5600});

  /* ---------- winding dotted trail (drawn left-to-right) ---------- */
  const dotEls=[];
  for(let x=96;x<=444;x+=9){
    const c=mk('circle',{cx:x,cy:yAt(x),r:1.7,fill:'#D2913C'});
    c.style.opacity='0'; c.style.transformBox='fill-box';
    c.style.transformOrigin='center'; c.style.transform='scale(0.3)';
    $('dotsG').appendChild(c);
    dotEls.push({c:c, t:1300+(x-96)/348*4200});
  }

  /* ---------- jumpers: parachute, then run ---------- */
  const CHUTE=
    '<g class="chute">'+
      '<polygon points="-7,-13 -7.5,-18 -4,-20.5 0,-21 4,-20.5 7.5,-18 7,-13 3.5,-11.5 2.5,-12.5 0,-11 -2.5,-12.5 -3.5,-11.5" fill="#D2913C"/>'+
      '<path d="M0,-21 L0,-12" stroke="#a86f28" stroke-width="0.5" fill="none"/>'+
      '<path d="M-1.6,-7.2 L-7,-13 M-1.6,-7.2 L-2.5,-12 M1.6,-7.2 L2.5,-12 M1.6,-7.2 L7,-13" stroke="#9AA088" stroke-width="0.5" fill="none"/>'+
      '<path d="M-1.2,0 L0,-2.6 M1.2,0 L0,-2.6" stroke="#ECE6D6" stroke-width="1.2" stroke-linecap="round" fill="none"/>'+
      '<path d="M0,-2.6 L0,-5.2" stroke="#ECE6D6" stroke-width="1.2" stroke-linecap="round" fill="none"/>'+
      '<path d="M0,-4.6 L-1.6,-7.2 M0,-4.6 L1.6,-7.2" stroke="#ECE6D6" stroke-width="1.2" stroke-linecap="round" fill="none"/>'+
      '<circle cx="0" cy="-6.3" r="1.15" fill="#ECE6D6"/>'+
    '</g>';
  const RUN=
    '<g class="run">'+
      '<path d="M0,-5.2 L-0.3,-2.2" stroke="#ECE6D6" stroke-width="1.2" stroke-linecap="round" fill="none"/>'+
      '<path d="M-0.3,-2.2 L1.7,0 M-0.3,-2.2 L-1.6,0.2" stroke="#ECE6D6" stroke-width="1.2" stroke-linecap="round" fill="none"/>'+
      '<path d="M0,-4.4 L1.4,-3.4 M0,-4.4 L-1.4,-5.2" stroke="#ECE6D6" stroke-width="1.2" stroke-linecap="round" fill="none"/>'+
      '<circle cx="0.5" cy="-6" r="1.15" fill="#ECE6D6"/>'+
    '</g>';

  const LAND_OFF=0.4423;     // 2300ms descent / 5200ms total
  const menData=[];
  for(let i=0;i<5;i++){
    const ds=350+i*330, land=ds+2300, endX=448-i*6, landX=230-i*3, landY=yAt(landX), startX=landX-10, startY=13;
    const g=mk('g',{class:'man'}); g.style.transform='translate('+startX.toFixed(2)+'px,'+startY+'px)';
    const figs=mk('g',{class:'figs'}); figs.style.opacity='0';
    figs.innerHTML=CHUTE+RUN;
    g.appendChild(figs); $('menG').appendChild(g);
    const chuteEl=figs.querySelector('.chute'); chuteEl.style.opacity='1';
    const runEl=figs.querySelector('.run'); runEl.style.opacity='0';
    const kf=[];
    const D=6;                                  // descent w/ canopy sway
    for(let s=0;s<=D;s++){
      const t=s/D, sway=4*Math.sin(t*Math.PI*3)*(1-t);
      const x=startX+(landX-startX)*t+sway, y=startY+(landY-startY)*t;
      kf.push({offset:LAND_OFF*t, transform:'translate('+x.toFixed(2)+'px,'+y.toFixed(2)+'px)', easing:'linear'});
    }
    const R=14;                                 // run along winding trail
    for(let s=1;s<=R;s++){
      const fx=landX+(endX-landX)*s/R, fy=yAt(fx);
      kf.push({offset:LAND_OFF+(1-LAND_OFF)*s/R, transform:'translate('+fx.toFixed(2)+'px,'+fy.toFixed(2)+'px)', easing:s===1?'cubic-bezier(.35,0,.5,1)':'linear'});
    }
    menData.push({g:g,figs:figs,chuteEl:chuteEl,runEl:runEl,ds:ds,land:land,endX:endX,landY:landY,kf:kf});
  }

  /* ---------- engine ---------- */
  let current=[], timer=null, loopOn=true;
  const add=function(a){current.push(a); return a;};
  function stopAll(){ current.forEach(function(a){try{a.cancel();}catch(e){}}); current=[]; if(timer){clearTimeout(timer);timer=null;} }

  function build(){
    floatItems.forEach(function(o){add(o.el.animate([
      {transform:'translateY('+FLOAT_OFF+'px)',opacity:0,easing:'cubic-bezier(.18,.7,.28,1)'},
      {transform:'translateY(-1.5px)',opacity:1,offset:0.82},
      {transform:'translateY(0px)',opacity:1}
    ],{duration:680,delay:o.start,fill:'both'}));});
    dotEls.forEach(function(o){add(o.c.animate(
      [{opacity:0,transform:'scale(0.3)'},{opacity:1,transform:'scale(1)'}],
      {duration:180,delay:o.t,fill:'both',easing:'cubic-bezier(.3,1.4,.5,1)'}));});
    menData.forEach(function(m){
      add(m.g.animate(m.kf,{duration:5200,delay:m.ds,fill:'both'}));
      add(m.figs.animate([{opacity:0},{opacity:1}],{duration:250,delay:m.ds,fill:'both'}));
      add(m.chuteEl.animate([{opacity:1},{opacity:0}],{duration:160,delay:m.land,fill:'both'}));
      add(m.runEl.animate([{opacity:0},{opacity:1}],{duration:160,delay:m.land,fill:'both'}));
    });
  }
  function play(){ stopAll(); build(); if(loopOn){ timer=setTimeout(play,CYCLE);} }

  function showFinal(){
    stopAll();
    floatItems.forEach(function(o){ o.el.style.transform='translateY(0px)'; o.el.style.opacity=1; });
    dotEls.forEach(function(o){o.c.style.opacity=1;o.c.style.transform='scale(1)';});
    menData.forEach(function(m){
      m.figs.style.opacity=1; m.chuteEl.style.opacity=0; m.runEl.style.opacity=1;
      m.g.style.transform='translate('+m.endX.toFixed(2)+'px,'+yAt(m.endX).toFixed(2)+'px)';
    });
  }

  /* ---------- ambient loops (always on) ---------- */
  $('birds').style.transformBox='fill-box'; $('birds').style.transformOrigin='center';
  $('birds').animate([{transform:'translate(0px,0px)'},{transform:'translate(10px,-1.5px)'}],
    {duration:9000,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});
  const fire=$('fire'); fire.style.transformBox='fill-box'; fire.style.transformOrigin='bottom center';
  fire.animate([{transform:'scale(1,1)',opacity:1},{transform:'scale(1.12,0.9)',opacity:0.82},{transform:'scale(0.94,1.06)',opacity:1}],
    {duration:520,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});
  const pulse=$('pulse'); pulse.style.transformBox='fill-box'; pulse.style.transformOrigin='center';
  pulse.animate([{transform:'scale(0.7)',opacity:0.5},{transform:'scale(2.0)',opacity:0}],
    {duration:2600,iterations:Infinity,easing:'ease-out'});

  /* ---------- controls ---------- */
  $('replay').addEventListener('click',play);
  const loopBtn=$('loop');
  loopBtn.addEventListener('click',function(){
    loopOn=!loopOn; loopBtn.textContent='Loop: '+(loopOn?'on':'off');
    loopBtn.classList.toggle('ghost',!loopOn);
    if(loopOn) play(); else if(timer){clearTimeout(timer);timer=null;}
  });

  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ loopOn=false; loopBtn.textContent='Loop: off'; loopBtn.classList.add('ghost'); showFinal(); }
  else { play(); }
})();
</script>
</body></html>
